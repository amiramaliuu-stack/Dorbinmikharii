<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dorbinbekharbaba</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:white;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,#500 0,#180000 28%,#050505 70%);z-index:-1}.card{width:min(92%,520px);padding:30px 22px;border:1px solid #f33;border-radius:26px;background:#090909e8;box-shadow:0 20px 80px #000,0 0 45px #9003;animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}.logo{text-align:center;color:#ff3030;font-weight:bold;margin-bottom:22px}.title{text-align:center;font-size:clamp(25px,7vw,38px);line-height:1.6;margin:0 0 28px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn,.select,.option{border:1px solid #ffffff22;background:#151515;color:#fff;border-radius:14px;padding:15px;font:inherit;font-weight:bold;cursor:pointer}.yes{background:linear-gradient(135deg,#f33,#900);border:0}.field{margin:16px 0}.label{display:block;margin-bottom:8px;font-weight:bold}.options{display:grid;gap:7px;margin-top:7px}.option:hover,.chosen{background:#350909;border-color:#f33}.disabled{opacity:.4}.error{display:none;background:#350707;color:#ff7777;padding:11px;border-radius:11px;margin-top:8px}.submit{width:100%;margin-top:10px}.thanks{text-align:center}.thanks .emoji{font-size:60px}.thanks h1{line-height:1.7}
</style><div id="app"></div><script>
const A=document.getElementById('app');let d={m:'',w:'',t:false};
function home(){A.innerHTML='<section class="card"><div class="logo">dorbinbekharbaba</div><h1 class="title">برام دوربین GOPRO میخری؟</h1><div class="buttons"><button class="btn" id="no">خیر</button><button class="btn yes" id="yes">بله ❤️</button></div></section>';no.onclick=()=>no.animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:250});yes.onclick=form}
function form(){A.innerHTML='<section class="card"><div class="logo">dorbinbekharbaba</div><h2 class="title" style="font-size:25px">پس قولمون قطعه 😎</h2><div class="field"><span class="label">مدل دوربین خود را وارد کنید</span><div class="select" id="ms">انتخاب مدل ▾</div><div class="options" id="mo" hidden><div class="option">Gopro 11 hero black</div><div class="option">Gopro 12 hero black</div><div class="option">Gopro 13 hero black</div></div></div><div class="field"><span class="label">کی میخری برام؟</span><div class="select" id="ws">انتخاب زمان ▾</div><div class="options" id="wo" hidden><div class="option">همین الان</div><div class="option">فردا</div><div class="option">پس فردا</div></div></div><div class="field"><span class="label">دروغ که نمیگی؟ 🫤</span><div class="options"><div class="option disabled" id="lie">چرا دروغ گفتم</div><div class="option" id="truth">نه دروغ نمیگیم</div></div><div class="error" id="err">دروغگو دروغ نگو</div></div><button class="btn yes submit" id="finish">ثبت قول 🤝</button></section>';
ms.onclick=()=>{mo.hidden=!mo.hidden;wo.hidden=true};ws.onclick=()=>{wo.hidden=!wo.hidden;mo.hidden=true};
document.querySelectorAll('#mo .option').forEach(x=>x.onclick=()=>{d.m=x.textContent;ms.textContent=x.textContent;mo.hidden=true});document.querySelectorAll('#wo .option').forEach(x=>x.onclick=()=>{d.w=x.textContent;ws.textContent=x.textContent;wo.hidden=true});lie.onclick=()=>{err.style.display='block'};truth.onclick=()=>{d.t=true;truth.classList.add('chosen')};finish.onclick=()=>{if(d.m&&d.w&&d.t)thanks();else{err.textContent='همه گزینه‌ها رو انتخاب کن 😎';err.style.display='block'}}
}
function thanks(){A.innerHTML='<section class="card thanks"><div class="logo">dorbinbekharbaba</div><div class="emoji">😍</div><h1>ممنونم که دوربینو برام میخری😍</h1><p style="color:#aaa">قولت ثبت شد ❤️</p></section>'}home();
</script>
